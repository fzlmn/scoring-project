version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: scoring_postgres
    environment:
      POSTGRES_DB: scoring_db
      POSTGRES_USER: scoring_user
      POSTGRES_PASSWORD: scoring_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: